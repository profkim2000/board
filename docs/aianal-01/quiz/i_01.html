<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과일 퀴즈</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 100vw;
            margin: 5px;
            padding: 5px;
            background-color: #f9f9f9;
        }
        .quiz-card {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .question {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .quiz-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 15px;
            display: block;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-btn {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        .option-btn:hover {
            background-color: #f0f0f0;
        }
        .result {
            margin-top: 12px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .correct {
            color: #2e7d32;
        }
        .incorrect {
            color: #c62828;
        }
    </style>
</head>
<body>
    <div id="quiz-container"></div>

    <script>
        // 기본 이미지 폴더 경로 설정
        const IMAGE_BASE_PATH = "attachments/";

        const quizData = [
            {
                "no": 1,
                "q": "노란 과일은?",
                "img": "test.png", // -> attachments/test.jpg 경로를 불러옵니다.
                "a1": "사과",
                "a2": "바나나",
                "a3": "포도",
                "a4": "오렌지",
                "ans": 2
            },
            {
                "no": 2,
                "q": "보라색 과일은?",
                "img": "",
                "a1": "사과",
                "a2": "바나나",
                "a3": "포도",
                "a4": "오렌지",
                "ans": 3
            }
        ];

        const container = document.getElementById('quiz-container');

        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';

            // 1. 문제 출력 (q)
            const questionEl = document.createElement('div');
            questionEl.className = 'question';
            questionEl.textContent = `${item.no}. ${item.q}`;
            card.appendChild(questionEl);

            // 2. 이미지 출력 (img 값이 존재할 경우 기본 폴더 경로 연결)
            if (item.img && item.img.trim() !== "") {
                const imgEl = document.createElement('img');
                
                // attachments/파일명 형식으로 경로 생성
                imgEl.src = IMAGE_BASE_PATH + item.img;
                imgEl.alt = `문제 ${item.no} 이미지`;
                imgEl.className = 'quiz-image';

                // 로딩 에러 시 콘솔에 상세 경로 출력
                imgEl.onerror = () => {
                    console.error(`이미지를 불러올 수 없습니다. 경로를 확인해주세요: ${imgEl.src}`);
                };

                card.appendChild(imgEl);
            }

            // 3. 보기 출력 (a1 ~ a4)
            const optionsEl = document.createElement('div');
            optionsEl.className = 'options';

            for (let i = 1; i <= 4; i++) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${i}) ${item['a' + i]}`;
                
                btn.onclick = () => checkAnswer(index, i, resultEl);
                optionsEl.appendChild(btn);
            }
            card.appendChild(optionsEl);

            // 4. 결과 표시 영역
            const resultEl = document.createElement('div');
            resultEl.className = 'result';
            card.appendChild(resultEl);

            container.appendChild(card);
        });

        function checkAnswer(quizIndex, selectedOption, resultElement) {
            const correctAnswer = quizData[quizIndex].ans;

            if (selectedOption === correctAnswer) {
                resultElement.textContent = "⭕ 정답입니다!";
                resultElement.className = "result correct";
            } else {
                resultElement.textContent = "❌ 틀렸습니다. 다시 시도해보세요.";
                resultElement.className = "result incorrect";
            }
        }
    </script>
</body>
</html>
